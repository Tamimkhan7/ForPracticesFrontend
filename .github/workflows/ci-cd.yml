name: Frontend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  IMAGE_NAME: forpractices-frontend
  AWS_REGION: ap-southeast-1
  AWS_ROLE_ARN: arn:aws:iam::314437260046:role/github-actions-forpractices
  AWS_INSTANCE_ID: i-06e802252ee411a94

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  push-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: push-image
    runs-on: ubuntu-latest
    environment: production       
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write            
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          disable-retry: true

      - name: Deploy frontend to EC2 via SSM
        env:
          INSTANCE_ID: ${{ env.AWS_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"

          # ---- script that runs ON the server (as root, via SSM) ----
          cat > deploy.sh <<'SCRIPT'
          set -euo pipefail

          NAME=frontend
          PREV="$(docker inspect -f '{{.Config.Image}}' "$NAME" 2>/dev/null || true)"

          docker pull "$IMAGE"

          run_web() {
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            docker run -d --name "$NAME" --restart unless-stopped --network appnet \
              -p 80:80 -e BACKEND_URL=http://api:8080 "$1"
          }

          healthy() {
            for i in $(seq 1 15); do
              code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ || true)"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 2
            done
            return 1
          }

          run_web "$IMAGE"
          if healthy; then
            echo "Deploy OK: $IMAGE"
            docker image prune -f >/dev/null
          else
            echo "Health check FAILED. Rolling back to: ${PREV:-none}"
            docker logs "$NAME" --tail 30 || true
            if [ -n "$PREV" ]; then run_web "$PREV"; fi
            exit 1
          fi
          SCRIPT

          # SSM runs commands with /bin/sh (dash), so save the script on the
          # server and run it with bash
          {
            echo "export IMAGE='${IMAGE}'"
            echo "cat > /tmp/deploy-frontend.sh <<'EOS'"
            cat deploy.sh
            echo "EOS"
            echo "bash /tmp/deploy-frontend.sh"
          } > full.sh
          jq -R -s '{commands: split("\n")}' full.sh > params.json

          # ---- send the command (retry in case the SSM agent is still starting) ----
          CMD_ID=""
          for attempt in 1 2 3 4 5; do
            if CMD_ID="$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --comment "deploy frontend ${GITHUB_SHA}" \
                --parameters file://params.json \
                --timeout-seconds 600 \
                --query "Command.CommandId" --output text)"; then
              break
            fi
            echo "SSM not ready (attempt ${attempt}/5). Retrying in 30s..."
            CMD_ID=""
            sleep 30
          done
          if [ -z "$CMD_ID" ]; then
            echo "Could not send the command. Is the EC2 instance Running and is SSM online?"
            exit 1
          fi

          # ---- wait for the result ----
          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "SSM status: ${STATUS}"
          echo "----- server stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true
          echo "----- server stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true

          [ "$STATUS" = "Success" ]